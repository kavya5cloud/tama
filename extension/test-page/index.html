<!doctype html>
<html><head><meta charset="utf-8"><title>Tama Test Page</title><style>body{font-family:system-ui;max-width:680px;margin:80px auto;padding:0 24px;background:#f5f2ed;color:#171815}input{padding:14px;border:1px solid #d8d3ca;border-radius:14px;width:100%;box-sizing:border-box;margin:10px 0 12px}button{padding:12px 18px;border:0;border-radius:14px;background:#193c2b;color:white;font-weight:600}.card{padding:28px;border:1px solid #d8d3ca;border-radius:28px;background:#fffdfa}</style></head>
<body><div class="card"><h1>Company Lookup</h1><p>Use this tiny page to test Tama's teaching and replay.</p><label for="company">Company</label><input id="company" name="company" placeholder="Type a company name"><button id="search">Search</button><div id="result" style="margin-top:20px;font-weight:600"></div></div><script>document.getElementById('search').addEventListener('click',()=>{const v=document.getElementById('company').value.trim();document.getElementById('result').textContent=v?`Searching for ${v}…`:'Please enter a company.'})</script></body></html>
